name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1) Tổng quan (gọn)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: thannhf
          template: classic
          filename: metrics/overview.svg
          base: header, activity, community, repositories
          config_display: columns
          config_timezone: Asia/Ho_Chi_Minh

      # 2) Ngôn ngữ + số dòng code + topics
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: thannhf
          template: classic
          filename: metrics/languages.svg
          base: ""
          config_display: columns
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_analysis_timeout: 30
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 12

      # 3) Repo nổi bật
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: thannhf
          template: classic
          filename: metrics/repos.svg
          base: ""
          config_display: columns
          plugin_repositories: yes

  assets:
    runs-on: ubuntu-latest
    needs: metrics
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # Huy hiệu tự vẽ bằng SVG, mở khóa theo số liệu thật
      - name: Tạo huy hiệu thành tựu
        env:
          GH_USER: thannhf
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 scripts/generate_badges.py

      # Badge TryHackMe tải về lưu trong repo
      - name: Tải badge TryHackMe
        run: curl -fsSL "https://tryhackme-badges.s3.amazonaws.com/38cudo.png" -o assets/tryhackme.png || echo "TryHackMe lỗi, giữ ảnh cũ"

      - name: Commit nếu có thay đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/badges.svg assets/tryhackme.png
          git diff --cached --quiet || (git commit -m "chore: update badges" && git pull --rebase && git push)
