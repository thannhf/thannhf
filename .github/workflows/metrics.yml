name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1) Tổng quan đầy đủ: profile, commit, PR, issue, repo, license...
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: thannhf
          template: classic
          filename: metrics/overview.svg
          base: header, activity, community, repositories, metadata
          config_display: columns
          config_timezone: Asia/Ho_Chi_Minh
          config_animations: yes

      # 2) Ngôn ngữ + số dòng code + topics
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: thannhf
          template: classic
          filename: metrics/languages.svg
          base: ""
          config_display: columns
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, bytes-size
          plugin_languages_analysis_timeout: 30
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 12

      # 3) Repo nổi bật + đóng góp đáng chú ý
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: thannhf
          template: classic
          filename: metrics/repos.svg
          base: ""
          config_display: columns
          plugin_repositories: yes
          plugin_repositories_featured: thannhf/thannhf
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_repositories: yes

      # 4) Lịch đóng góp 2D (không 3D) + streak
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: thannhf
          template: classic
          filename: metrics/calendar.svg
          base: ""
          config_display: columns
          plugin_calendar: yes
          plugin_calendar_limit: 12
          plugin_calendar_size: 14
          plugin_streak: yes
          plugin_streak_days: 365

  tryhackme:
    runs-on: ubuntu-latest
    needs: metrics
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tải badge TryHackMe về repo
        run: |
          mkdir -p assets
          curl -fsSL "https://tryhackme-badges.s3.amazonaws.com/38cudo.png" -o assets/tryhackme.png
      - name: Commit nếu có thay đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tryhackme.png
          git diff --cached --quiet || (git commit -m "chore: update tryhackme badge" && git pull --rebase && git push)